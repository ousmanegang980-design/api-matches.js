<!DOCTYPE html>
<html lang="fr" class="h-full bg-[#0b1522] text-slate-100">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>1xPredict AI - Vrais Matchs en Direct & Coupons</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .modal-backdrop { backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
    .odds-btn.selected {
      background-color: #00b050 !important;
      color: #ffffff !important;
      border-color: #00e668 !important;
    }
  </style>
</head>
<body class="min-h-full flex flex-col bg-[#0b1522] text-slate-100 antialiased pb-24">

  <!-- TOP HEADER 1XBET -->
  <header class="sticky top-0 z-40 bg-[#14243b] border-b border-[#243e63] shadow-lg">
    <div class="max-w-6xl mx-auto px-3 sm:px-4 h-14 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 select-none">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-r from-blue-600 to-[#207cd4] flex items-center justify-center font-black text-white italic text-sm">
          1X
        </div>
        <div class="flex items-center gap-2">
          <span class="font-black text-base tracking-tight text-white">
            <span class="text-[#207cd4]">PREDICT</span><span class="text-[#00b050]">AI</span>
          </span>
          <span id="badgeLiveReal" class="text-[10px] font-mono px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 animate-pulse">
            ● EN DIRECT DU SERVEUR
          </span>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="loadRealMatchesFromServer()" class="p-2 rounded-lg bg-[#1d3250] hover:bg-[#243e63] text-slate-300 transition" title="Actualiser les vrais matchs">
          <i data-lucide="refresh-cw" id="iconRefresh" class="w-4 h-4"></i>
        </button>

        <button onclick="openGeneratorModal()" class="px-3 py-1.5 rounded-lg bg-[#00b050] hover:bg-emerald-600 text-white font-black text-xs flex items-center gap-1.5 shadow-md">
          <i data-lucide="zap" class="w-3.5 h-3.5 fill-white"></i>
          <span>Générateur IA</span>
        </button>

        <button onclick="openSlipModal()" class="relative p-2 rounded-lg bg-[#1d3250] hover:bg-[#243e63] text-white border border-[#243e63]">
          <i data-lucide="ticket" class="w-4 h-4 text-[#ffc700]"></i>
          <span id="headerSlipCount" class="absolute -top-1 -right-1 w-5 h-5 rounded-full bg-[#00b050] text-white text-[10px] font-black flex items-center justify-center">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- NAVIGATION -->
  <div class="bg-[#14243b] border-b border-[#243e63] sticky top-14 z-30">
    <div class="max-w-6xl mx-auto px-3 flex items-center justify-between overflow-x-auto gap-2 py-2">
      <div class="flex items-center gap-1.5 shrink-0">
        <button onclick="setFilter('all')" id="btnTabAll" class="px-3 py-1.5 rounded-lg text-xs font-black bg-[#207cd4] text-white">
          Tous les Matchs du Jour
        </button>
        <button onclick="setFilter('live')" id="btnTabLive" class="px-3 py-1.5 rounded-lg text-xs font-bold text-slate-300 hover:bg-[#1d3250] flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-rose-500 animate-ping"></span>
          <span>En Direct</span>
        </button>
      </div>

      <div class="text-[11px] text-slate-400 font-mono shrink-0">
        <span id="labelMatchesCount" class="text-white font-bold">0</span> vrais matchs réels
      </div>
    </div>
  </div>

  <!-- MAIN LIST -->
  <main class="max-w-6xl w-full mx-auto px-3 sm:px-4 py-4 space-y-3">
    
    <div id="loadingStatusBox" class="p-4 bg-[#14243b] border border-[#243e63] rounded-2xl flex items-center justify-center gap-3 text-xs text-slate-300">
      <span class="w-4 h-4 border-2 border-[#207cd4] border-t-transparent rounded-full animate-spin"></span>
      <span>Récupération des vrais matchs officiels via le serveur...</span>
    </div>

    <div id="matchesContainer" class="space-y-2.5"></div>
  </main>

  <!-- BARRE DU BAS DU COUPON -->
  <div id="floatingSlipBar" class="fixed bottom-0 inset-x-0 z-40 bg-[#14243b] border-t-2 border-[#207cd4] shadow-2xl p-3 hidden">
    <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
      <div class="flex items-center gap-3 cursor-pointer" onclick="openSlipModal()">
        <div class="w-10 h-10 rounded-xl bg-[#207cd4] text-white font-black flex items-center justify-center text-sm">
          <span id="barSlipCount">0</span>
        </div>
        <div>
          <div class="flex items-center gap-2">
            <span class="text-xs font-bold text-slate-300">Cote Totale :</span>
            <span id="barSlipOdds" class="text-sm font-black text-[#ffc700] font-mono">1.00</span>
          </div>
          <p id="barSlipGain" class="text-[11px] text-[#00b050] font-bold font-mono">Gain estimé: 0 FCFA</p>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button onclick="clearBetSlip()" class="p-2 text-slate-400 hover:text-rose-400 rounded-lg bg-[#1d3250]">
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
        <button onclick="openSlipModal()" class="px-4 py-2.5 bg-[#00b050] hover:bg-emerald-600 text-white font-black text-xs rounded-xl shadow-lg flex items-center gap-1.5">
          <span>Voir le Coupon</span>
          <i data-lucide="chevron-up" class="w-4 h-4"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL COUPON -->
  <div id="modalBetSlip" class="fixed inset-0 z-50 flex items-end sm:items-center justify-center p-0 sm:p-4 bg-black/80 modal-backdrop hidden">
    <div class="bg-[#14243b] border border-[#243e63] rounded-t-3xl sm:rounded-3xl w-full max-w-lg p-5 space-y-4 shadow-2xl max-h-[85vh] flex flex-col">
      <div class="flex items-center justify-between border-b border-[#243e63] pb-3 shrink-0">
        <h3 class="font-black text-sm text-white">Coupon de Pari Combiné</h3>
        <button onclick="closeModal('modalBetSlip')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>

      <div id="modalSlipItemsContainer" class="flex-1 overflow-y-auto space-y-2 pr-1 text-xs"></div>

      <div class="bg-[#0b1522] p-3 rounded-2xl border border-[#243e63] space-y-2 shrink-0">
        <div class="flex justify-between text-xs">
          <span class="text-slate-400">Cote totale :</span>
          <span id="modalSlipTotalOdds" class="text-base font-black text-[#ffc700] font-mono">0.00</span>
        </div>
        <div>
          <label class="block text-[11px] text-slate-400 mb-1">Mise (FCFA) :</label>
          <input type="number" id="inputModalStake" value="1000" min="100" oninput="recalculateModalSlip()" class="w-full bg-[#14243b] border border-[#243e63] rounded-xl px-3 py-2 text-sm font-bold text-white font-mono" />
        </div>
        <div class="flex justify-between items-center pt-2 border-t border-[#243e63]">
          <span class="text-xs font-bold text-white">Gain Potentiel :</span>
          <span id="modalSlipPotentialPayout" class="text-lg font-black text-[#00b050] font-mono">0 FCFA</span>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 shrink-0">
        <button onclick="shareSlipWhatsApp()" class="py-3 bg-[#00b050] text-white font-black text-xs rounded-xl shadow-lg flex items-center justify-center gap-1.5">
          <i data-lucide="share-2" class="w-4 h-4"></i>
          <span>WhatsApp</span>
        </button>
        <button onclick="copy1xBetCode()" class="py-3 bg-[#1d3250] text-[#ffc700] font-black text-xs rounded-xl border border-[#243e63] flex items-center justify-center gap-1.5">
          <i data-lucide="copy" class="w-4 h-4"></i>
          <span>Code Coupon</span>
        </button>
      </div>
    </div>
  </div>

  <!-- MODAL GÉNÉRATEUR -->
  <div id="modalGenerator" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/80 modal-backdrop hidden">
    <div class="bg-[#14243b] border border-[#243e63] rounded-3xl w-full max-w-md p-5 sm:p-6 space-y-4 shadow-2xl">
      <div class="flex items-center justify-between border-b border-[#243e63] pb-3">
        <h3 class="font-black text-sm text-white">Générateur Automatique IA</h3>
        <button onclick="closeModal('modalGenerator')" class="text-slate-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div>
        <div class="flex justify-between items-center mb-1">
          <label class="text-xs font-bold text-slate-300">Nombre de matchs :</label>
          <span id="labelGeneratorEvents" class="text-xs font-black text-[#207cd4] font-mono">4 Matchs</span>
        </div>
        <input type="range" id="inputGenCount" min="2" max="15" value="4" oninput="document.getElementById('labelGeneratorEvents').textContent = this.value + ' Matchs'" class="w-full accent-[#207cd4]" />
      </div>
      <button onclick="executeAIGeneration()" class="w-full py-3 bg-[#00b050] text-white font-black text-xs rounded-xl shadow-lg flex items-center justify-center gap-1.5">
        <i data-lucide="sparkles" class="w-4 h-4"></i>
        <span>Générer avec les Vrais Matchs</span>
      </button>
    </div>
  </div>

  <!-- SCRIPT CLIENT -->
  <script>
    let realMatches = [];
    let currentFilter = "all";
    let betSlip = [];

    // APPEL À NOTRE VRAIE API VERCEL /api/matches SANS ERREUR CORS
    async function loadRealMatchesFromServer() {
      const box = document.getElementById("loadingStatusBox");
      const icon = document.getElementById("iconRefresh");
      if (icon) icon.classList.add("animate-spin");
      if (box) box.classList.remove("hidden");

      try {
        const res = await fetch("/api/matches");
        const data = await res.json();

        if (data && data.success && data.matches && data.matches.length > 0) {
          realMatches = data.matches;
          document.getElementById("badgeLiveReal").textContent = `● ${realMatches.length} VRAIS MATCHS REÇUS`;
        } else {
          console.warn("Aucun match renvoyé par l'API pour aujourd'hui.");
        }
      } catch (e) {
        console.error("Erreur serveur :", e);
      } finally {
        if (icon) icon.classList.remove("animate-spin");
        if (box) box.classList.add("hidden");
        renderMatches();
      }
    }

    function renderMatches() {
      const container = document.getElementById("matchesContainer");
      container.innerHTML = "";

      let list = [...realMatches];
      if (currentFilter === "live") list = list.filter(m => m.isLive);

      document.getElementById("labelMatchesCount").textContent = list.length;

      if (list.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-[#14243b] rounded-2xl border border-[#243e63] text-slate-400 text-xs">
            Aucun match disponible pour le moment.
          </div>
        `;
        return;
      }

      list.forEach(m => {
        const card = document.createElement("div");
        card.className = "bg-[#14243b] border border-[#243e63] rounded-2xl p-3 sm:p-4 shadow-md space-y-2.5";

        const sel1 = betSlip.some(b => b.matchId === m.id && b.market === "1");
        const selX = betSlip.some(b => b.matchId === m.id && b.market === "X");
        const sel2 = betSlip.some(b => b.matchId === m.id && b.market === "2");
        const sel1X = betSlip.some(b => b.matchId === m.id && b.market === "1X");
        const sel12 = betSlip.some(b => b.matchId === m.id && b.market === "12");
        const sel2X = betSlip.some(b => b.matchId === m.id && b.market === "2X");

        card.innerHTML = `
          <div class="flex items-center justify-between border-b border-[#243e63]/70 pb-2 text-xs">
            <span class="font-black text-[#207cd4]">${m.leagueName}</span>
            ${m.isLive ? `
              <span class="text-[10px] font-black text-rose-400 bg-rose-500/20 px-2 py-0.5 rounded-full border border-rose-500/30 flex items-center gap-1">
                <span class="w-1.5 h-1.5 rounded-full bg-rose-500 animate-ping"></span>
                LIVE ${m.time}
              </span>
            ` : `<span class="text-slate-400 font-mono text-[11px]">⏰ ${m.time}</span>`}
          </div>

          <div class="flex items-center justify-between gap-2">
            <div class="space-y-1 flex-1 min-w-0">
              <p class="font-black text-sm text-white truncate">${m.homeTeam}</p>
              <p class="font-black text-sm text-white truncate">${m.awayTeam}</p>
            </div>
            ${m.isLive ? `
              <div class="px-3 py-1 bg-[#0b1522] rounded-xl border border-[#243e63]">
                <span class="text-base font-black text-[#ffc700] font-mono tracking-widest">${m.score}</span>
              </div>
            ` : ''}
          </div>

          <div class="p-2 rounded-xl bg-[#0b1522] border border-[#243e63]/80 flex items-center justify-between text-xs">
            <span class="text-slate-300">Conseil IA : <strong class="text-[#00b050]">${m.prediction.pick}</strong></span>
            <span class="text-[10px] font-bold text-slate-400 font-mono">${m.prediction.prob}%</span>
          </div>

          <div class="space-y-1.5 pt-1">
            <div class="grid grid-cols-3 gap-1.5 text-center text-xs">
              <button onclick="toggleBetSelection('${m.id}', '1', '${m.homeTeam} (1)', ${m.odds['1']})" class="odds-btn py-2 px-1 rounded-xl bg-[#1d3250] hover:bg-[#243e63] border border-[#243e63] flex flex-col items-center transition ${sel1 ? 'selected' : ''}">
                <span class="text-[10px] text-slate-400">1</span>
                <span class="font-black font-mono text-white text-xs">${m.odds['1'].toFixed(2)}</span>
              </button>
              <button onclick="toggleBetSelection('${m.id}', 'X', 'Nul (X)', ${m.odds['X']})" class="odds-btn py-2 px-1 rounded-xl bg-[#1d3250] hover:bg-[#243e63] border border-[#243e63] flex flex-col items-center transition ${selX ? 'selected' : ''}">
                <span class="text-[10px] text-slate-400">X</span>
                <span class="font-black font-mono text-white text-xs">${m.odds['X'].toFixed(2)}</span>
              </button>
              <button onclick="toggleBetSelection('${m.id}', '2', '${m.awayTeam} (2)', ${m.odds['2']})" class="odds-btn py-2 px-1 rounded-xl bg-[#1d3250] hover:bg-[#243e63] border border-[#243e63] flex flex-col items-center transition ${sel2 ? 'selected' : ''}">
                <span class="text-[10px] text-slate-400">2</span>
                <span class="font-black font-mono text-white text-xs">${m.odds['2'].toFixed(2)}</span>
              </button>
            </div>

            <div class="grid grid-cols-3 gap-1.5 text-center text-xs">
              <button onclick="toggleBetSelection('${m.id}', '1X', '${m.homeTeam} ou Nul (1X)', ${m.odds['1X']})" class="odds-btn py-1.5 px-2 rounded-lg bg-[#0b1522] hover:bg-[#1d3250] border border-[#243e63] flex items-center justify-between text-[11px] transition ${sel1X ? 'selected' : ''}">
                <span class="text-slate-400">1X</span>
                <span class="font-bold font-mono text-white">${m.odds['1X'].toFixed(2)}</span>
              </button>
              <button onclick="toggleBetSelection('${m.id}', '12', '12', ${m.odds['12']})" class="odds-btn py-1.5 px-2 rounded-lg bg-[#0b1522] hover:bg-[#1d3250] border border-[#243e63] flex items-center justify-between text-[11px] transition ${sel12 ? 'selected' : ''}">
                <span class="text-slate-400">12</span>
                <span class="font-bold font-mono text-white">${m.odds['12'].toFixed(2)}</span>
              </button>
              <button onclick="toggleBetSelection('${m.id}', '2X', '${m.awayTeam} ou Nul (2X)', ${m.odds['2X']})" class="odds-btn py-1.5 px-2 rounded-lg bg-[#0b1522] hover:bg-[#1d3250] border border-[#243e63] flex items-center justify-between text-[11px] transition ${sel2X ? 'selected' : ''}">
                <span class="text-slate-400">2X</span>
                <span class="font-bold font-mono text-white">${m.odds['2X'].toFixed(2)}</span>
              </button>
            </div>
          </div>
        `;

        container.appendChild(card);
      });

      lucide.createIcons();
    }

    function toggleBetSelection(matchId, market, label, odds) {
      const match = realMatches.find(m => m.id === matchId);
      if (!match) return;

      const idx = betSlip.findIndex(b => b.matchId === matchId && b.market === market);
      if (idx > -1) {
        betSlip.splice(idx, 1);
      } else {
        const same = betSlip.findIndex(b => b.matchId === matchId);
        if (same > -1) betSlip.splice(same, 1);

        betSlip.push({ matchId: match.id, matchName: `${match.homeTeam} vs ${match.awayTeam}`, market, label, odds });
      }

      updateSlipUI();
      renderMatches();
    }

    function updateSlipUI() {
      const count = betSlip.length;
      document.getElementById("headerSlipCount").textContent = count;
      document.getElementById("barSlipCount").textContent = count;

      const bar = document.getElementById("floatingSlipBar");
      if (count > 0) bar.classList.remove("hidden");
      else bar.classList.add("hidden");

      let totalOdds = 1.0;
      betSlip.forEach(b => totalOdds *= b.odds);
      totalOdds = count > 0 ? Number(totalOdds.toFixed(2)) : 0;

      document.getElementById("barSlipOdds").textContent = totalOdds.toFixed(2);
      document.getElementById("modalSlipTotalOdds").textContent = totalOdds.toFixed(2);

      const stake = Number(document.getElementById("inputModalStake").value) || 1000;
      const potentialGain = Math.round(stake * totalOdds);

      document.getElementById("barSlipGain").textContent = `Gain estimé: ${potentialGain.toLocaleString()} FCFA`;
      document.getElementById("modalSlipPotentialPayout").textContent = `${potentialGain.toLocaleString()} FCFA`;

      const container = document.getElementById("modalSlipItemsContainer");
      container.innerHTML = "";
      betSlip.forEach((b, idx) => {
        const div = document.createElement("div");
        div.className = "flex items-center justify-between p-2.5 bg-[#0b1522] rounded-xl border border-[#243e63]";
        div.innerHTML = `
          <div class="min-w-0 flex-1">
            <p class="font-black text-white truncate">${idx + 1}. ${b.matchName}</p>
            <p class="text-[11px] text-[#00b050] font-bold">${b.label}</p>
          </div>
          <span class="font-black font-mono text-[#ffc700] text-xs">Cote ${b.odds.toFixed(2)}</span>
        `;
        container.appendChild(div);
      });
      lucide.createIcons();
    }

    function clearBetSlip() {
      betSlip = [];
      updateSlipUI();
      renderMatches();
    }

    function recalculateModalSlip() {
      let totalOdds = 1.0;
      betSlip.forEach(b => totalOdds *= b.odds);
      const stake = Number(document.getElementById("inputModalStake").value) || 0;
      const gain = Math.round(stake * (betSlip.length > 0 ? totalOdds : 0));
      document.getElementById("modalSlipPotentialPayout").textContent = `${gain.toLocaleString()} FCFA`;
      document.getElementById("barSlipGain").textContent = `Gain estimé: ${gain.toLocaleString()} FCFA`;
    }

    function executeAIGeneration() {
      const count = Number(document.getElementById("inputGenCount").value) || 4;
      let pool = [...realMatches];
      betSlip = [];
      const selected = pool.slice(0, Math.min(count, pool.length));

      selected.forEach(m => {
        betSlip.push({
          matchId: m.id,
          matchName: `${m.homeTeam} vs ${m.awayTeam}`,
          market: "1X",
          label: `${m.homeTeam} ou Nul (1X)`,
          odds: m.odds['1X']
        });
      });

      closeModal("modalGenerator");
      updateSlipUI();
      renderMatches();
      openModal("modalBetSlip");
      if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 80 });
    }

    function shareSlipWhatsApp() {
      if (betSlip.length === 0) return alert("Votre coupon est vide.");
      let totalOdds = 1.0;
      betSlip.forEach(b => totalOdds *= b.odds);
      const stake = Number(document.getElementById("inputModalStake").value) || 1000;
      const gain = Math.round(stake * totalOdds);

      let msg = `🔥 *COUPON OFFICIEL VRAIS MATCHS*\n📊 ${betSlip.length} Matchs · Cote : ${totalOdds.toFixed(2)}\n━━━━━━━━━━━━━━━━━━━━━\n`;
      betSlip.forEach((b, idx) => {
        msg += `${idx + 1}. *${b.matchName}* 👉 ${b.label} (Cote ${b.odds.toFixed(2)})\n`;
      });
      msg += `━━━━━━━━━━━━━━━━━━━━━\n💰 Mise : ${stake.toLocaleString()} FCFA\n💵 Gain : *${gain.toLocaleString()} FCFA*\n_Code : 1X-${Math.floor(1000 + Math.random() * 9000)}_`;
      window.open(`https://wa.me/?text=${encodeURIComponent(msg)}`, '_blank');
    }

    function copy1xBetCode() {
      const code = `1X-${Math.random().toString(36).substring(2, 7).toUpperCase()}`;
      navigator.clipboard.writeText(code).then(() => alert(`Code copié : ${code}`));
    }

    function setFilter(filter) {
      currentFilter = filter;
      document.getElementById("btnTabAll").className = filter === 'all' ? "px-3 py-1.5 rounded-lg text-xs font-black bg-[#207cd4] text-white" : "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-300 hover:bg-[#1d3250]";
      document.getElementById("btnTabLive").className = filter === 'live' ? "px-3 py-1.5 rounded-lg text-xs font-black bg-rose-600 text-white" : "px-3 py-1.5 rounded-lg text-xs font-bold text-slate-300 hover:bg-[#1d3250]";
      renderMatches();
    }

    function openSlipModal() { openModal("modalBetSlip"); }
    function openGeneratorModal() { openModal("modalGenerator"); }
    function openModal(id) { document.getElementById(id)?.classList.remove("hidden"); }
    function closeModal(id) { document.getElementById(id)?.classList.add("hidden"); }

    window.addEventListener("DOMContentLoaded", () => {
      loadRealMatchesFromServer();
    });
  </script>
</body>
</html>
